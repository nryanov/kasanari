####### QUARKUS SPECIFIC CONFIGS #######
quarkus.swagger-ui.always-include=false

quarkus.http.port=9090
quarkus.devservices.enabled=false

catalog.iceberg.type=KASANARI
catalog.iceberg.name=local
catalog.iceberg.catalog-properties."kasanari.jdbc.user"=postgres
catalog.iceberg.catalog-properties."kasanari.jdbc.password"=postgres
catalog.iceberg.catalog-properties."uri"=jdbc:postgresql://localhost:5432/postgres
catalog.iceberg.catalog-properties."io-impl"=org.apache.iceberg.aws.s3.S3FileIO
catalog.iceberg.catalog-properties."warehouse"=s3a://warehouse
catalog.iceberg.catalog-properties."s3.endpoint"=http://localhost:9000
catalog.iceberg.catalog-properties."s3.access-key-id"=admin
catalog.iceberg.catalog-properties."s3.secret-access-key"=password
catalog.iceberg.catalog-properties.""s3.path-style-access"=true

management.metadata.jdbc-properties."kasanari.jdbc.user"=postgres
management.metadata.jdbc-properties."kasanari.jdbc.password"=postgres
management.metadata.jdbc-properties."uri"=jdbc:postgresql://localhost:5432/postgres
