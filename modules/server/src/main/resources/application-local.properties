####### QUARKUS SPECIFIC CONFIGS #######
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

quarkus.http.port=9090
quarkus.devservices.enabled=false

catalog.iceberg.type=KASANARI
catalog.iceberg.properties."kasanari.jdbc.user"=postgres
catalog.iceberg.properties."kasanari.jdbc.password"=postgres
catalog.iceberg.properties."uri"=jdbc:postgresql://localhost:5432/postgres
catalog.iceberg.properties."io-impl"=org.apache.iceberg.aws.s3.S3FileIO
catalog.iceberg.properties."warehouse"=s3a://warehouse
catalog.iceberg.properties."s3.endpoint"=http://localhost:9000
catalog.iceberg.properties."s3.access-key-id"=admin
catalog.iceberg.properties."s3.secret-access-key"=password
catalog.iceberg.properties.""s3.path-style-access"=true
