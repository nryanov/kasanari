####### QUARKUS SPECIFIC CONFIGS #######
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/docs

quarkus.http.port=9090

quarkus.container-image.group=local
quarkus.container-image.name=application
quarkus.container-image.tag=latest
quarkus.container-image.build=true
quarkus.container-image.push=false

# uncomment if build for arm
# quarkus.jib.platforms=linux/arm64/v8

# Management metadata storage
management.metadata.jdbc-properties."kasanari.jdbc.user"=postgres
management.metadata.jdbc-properties."kasanari.jdbc.password"=postgres
management.metadata.jdbc-properties."uri"=jdbc:postgresql://localhost:5432/postgres

