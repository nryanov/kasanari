  /lance/v1/table/{id}/tags/update:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1table~1{id}~1tags~1update'

  /lance/v1/transaction/{id}/describe:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1transaction~1{id}~1describe'

  /lance/v1/transaction/{id}/alter:
