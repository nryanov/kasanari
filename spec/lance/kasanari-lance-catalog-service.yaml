  /lance/v1/table/{id}/version/list:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1table~1{id}~1version~1list'

  /lance/v1/table/{id}/alter_columns:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1table~1{id}~1alter_columns'

  /lance/v1/table/{id}/drop_columns:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1table~1{id}~1drop_columns'

  /lance/v1/table/{id}/stats:
