---
openapi: 3.0.3
info:
  title: Kasanari Lance REST Catalog API
  version: 0.0.1

# The server configuration is sourced from lance-openapi-2.0.0.yaml
servers:
  - url: "{scheme}://{host}/{basePath}"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: Generic base server URL, with all parts configurable
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      port:
        description: The port used when addressing the host
        default: "443"
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""

# The security configuration is sourced from lance-openapi-2.0.0.yaml
# All routes are currently configured using an Authorization header.
security:
  - OAuth2: []
  - BearerAuth: []

paths:

  ##########################
  # Lance REST Catalog API #
  # '~1' -> replacement for '/'
  ##########################

  /lance/v1/namespace/{id}/create:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1namespace~1{id}~1create'

  /lance/v1/namespace/{id}/list:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1namespace~1{id}~1list'

  /lance/v1/namespace/{id}/describe:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1namespace~1{id}~1describe'

  /lance/v1/namespace/{id}/drop:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1namespace~1{id}~1drop'

  /lance/v1/namespace/{id}/exists:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1namespace~1{id}~1exists'

  /lance/v1/namespace/{id}/table/list:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1namespace~1{id}~1table~1list'

  /lance/v1/table/{id}/register:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1table~1{id}~1register'

  /lance/v1/table/{id}/describe:
    $ref: './lance-openapi-2.0.0.yaml#/paths/~1v1~1table~1{id}~1describe'

