components:
  securitySchemes:
    OAuth2:
      type: oauth2
      description:
        This scheme is used for OAuth2 authorization.
      flows:
        clientCredentials:
          tokenUrl: /lance/v1/oauth/tokens
          scopes: {}
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
