---
openapi: 3.0.3
info:
  title: Kasanari Catalog Management API
  version: 0.0.1
servers:
  - url: "{scheme}://{host}/{basePath}"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: Generic base server URL, with all parts configurable
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      port:
        description: The port used when addressing the host
        default: "443"
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""
security:
  - BearerAuth: []
tags:
  - name: Catalogs
  - name: Security
paths:
  /management/v1/catalogs:
    post:
      tags:
        - Catalogs
      operationId: createCatalog
      summary: Create catalog metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPublicInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /management/v1/catalogs/{catalogId}:
    get:
      tags:
        - Catalogs
      operationId: getCatalog
      summary: Get catalog metadata without secret values
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPublicInfo"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Catalogs
      operationId: updateCatalog
      summary: Update catalog metadata
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPublicInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Catalogs
      operationId: deleteCatalog
      summary: Delete catalog metadata
      parameters:
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /management/v1/security/roles:
    get:
      tags:
        - Security
      operationId: getRoles
      summary: Get role bindings
      parameters:
        - in: query
          name: subject
          required: false
          schema:
            type: string
        - in: query
          name: catalogType
          required: false
          schema:
            $ref: "#/components/schemas/CatalogType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRolesResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Security
      operationId: updateRoles
      summary: Upsert role bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRolesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Security
      operationId: deleteRoles
      summary: Delete role bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRolesRequest"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogId:
      in: path
      name: catalogId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CatalogType:
      type: string
      enum:
        - ICEBERG
        - PAIMON
        - LANCE
    CatalogMode:
      type: string
      enum:
        - INTERNAL
        - PROXY
    CreateCatalogRequest:
      type: object
      required:
        - catalogId
        - catalogType
        - mode
        - spec
      properties:
        catalogId:
          type: string
        catalogType:
          $ref: "#/components/schemas/CatalogType"
        mode:
          $ref: "#/components/schemas/CatalogMode"
        spec:
          $ref: "#/components/schemas/CatalogSpec"
    UpdateCatalogRequest:
      type: object
      required:
        - spec
      properties:
        spec:
          $ref: "#/components/schemas/CatalogSpec"
        expectedVersion:
          type: integer
          format: int64
    CatalogPublicInfo:
      type: object
      required:
        - catalogId
        - catalogType
        - mode
        - spec
        - secretKeys
      properties:
        catalogId:
          type: string
        catalogType:
          $ref: "#/components/schemas/CatalogType"
        mode:
          $ref: "#/components/schemas/CatalogMode"
        spec:
          $ref: "#/components/schemas/CatalogPublicSpec"
        secretKeys:
          type: array
          items:
            type: string
        version:
          type: integer
          format: int64
    CatalogSpec:
      oneOf:
        - $ref: "#/components/schemas/IcebergCatalogSpec"
        - $ref: "#/components/schemas/PaimonCatalogSpec"
        - $ref: "#/components/schemas/LanceCatalogSpec"
    CatalogPublicSpec:
      oneOf:
        - $ref: "#/components/schemas/IcebergCatalogPublicSpec"
        - $ref: "#/components/schemas/PaimonCatalogPublicSpec"
        - $ref: "#/components/schemas/LanceCatalogPublicSpec"

    IcebergCatalogSpec:
      type: object
      required:
        - type
        - modeConfig
      properties:
        type:
          type: string
          enum: [ICEBERG]
        modeConfig:
          oneOf:
            - $ref: "#/components/schemas/InternalCatalogConfig"
            - $ref: "#/components/schemas/ProxyCatalogConfig"
    PaimonCatalogSpec:
      type: object
      required:
        - type
        - modeConfig
      properties:
        type:
          type: string
          enum: [PAIMON]
        modeConfig:
          oneOf:
            - $ref: "#/components/schemas/InternalCatalogConfig"
            - $ref: "#/components/schemas/ProxyCatalogConfig"
    LanceCatalogSpec:
      type: object
      required:
        - type
        - modeConfig
      properties:
        type:
          type: string
          enum: [LANCE]
        modeConfig:
          oneOf:
            - $ref: "#/components/schemas/InternalCatalogConfig"
            - $ref: "#/components/schemas/ProxyCatalogConfig"

    IcebergCatalogPublicSpec:
      type: object
      required:
        - type
        - modeConfig
      properties:
        type:
          type: string
          enum: [ICEBERG]
        modeConfig:
          oneOf:
            - $ref: "#/components/schemas/InternalCatalogPublicConfig"
            - $ref: "#/components/schemas/ProxyCatalogPublicConfig"
    PaimonCatalogPublicSpec:
      type: object
      required:
        - type
        - modeConfig
      properties:
        type:
          type: string
          enum: [PAIMON]
        modeConfig:
          oneOf:
            - $ref: "#/components/schemas/InternalCatalogPublicConfig"
            - $ref: "#/components/schemas/ProxyCatalogPublicConfig"
    LanceCatalogPublicSpec:
      type: object
      required:
        - type
        - modeConfig
      properties:
        type:
          type: string
          enum: [LANCE]
        modeConfig:
          oneOf:
            - $ref: "#/components/schemas/InternalCatalogPublicConfig"
            - $ref: "#/components/schemas/ProxyCatalogPublicConfig"

    InternalCatalogConfig:
      type: object
      required:
        - properties
      properties:
        properties:
          type: object
          additionalProperties:
            type: string
        secrets:
          type: object
          additionalProperties:
            type: string
    ProxyCatalogConfig:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string
        secrets:
          type: object
          additionalProperties:
            type: string
    InternalCatalogPublicConfig:
      type: object
      required:
        - properties
      properties:
        properties:
          type: object
          additionalProperties:
            type: string
    ProxyCatalogPublicConfig:
      type: object
      required:
        - endpoint
      properties:
        endpoint:
          type: string
        properties:
          type: object
          additionalProperties:
            type: string

    RoleBinding:
      type: object
      required:
        - subject
        - catalogType
        - role
      properties:
        subject:
          type: string
        catalogType:
          $ref: "#/components/schemas/CatalogType"
        role:
          type: string
          enum:
            - catalog_admin
            - catalog_reader
            - security_admin
            - security_reader
    GetRolesResponse:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
    UpdateRolesRequest:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
    DeleteRolesRequest:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
