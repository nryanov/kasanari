---
openapi: 3.0.3
info:
  title: Kasanari Catalog Management API
  version: 0.0.1
servers:
  - url: "{scheme}://{host}/{basePath}"
    description: Server URL when the port can be inferred from the scheme
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""
  - url: "{scheme}://{host}:{port}/{basePath}"
    description: Generic base server URL, with all parts configurable
    variables:
      scheme:
        description: The scheme of the URI, either http or https.
        default: https
      host:
        description: The host address for the specified server
        default: localhost
      port:
        description: The port used when addressing the host
        default: "443"
      basePath:
        description: Optional prefix to be appended to all routes
        default: ""
security:
  - BearerAuth: []
tags:
  - name: Catalogs
  - name: Security
paths:
  /management/v1/catalogs:
    post:
      tags:
        - Catalogs
      operationId: createCatalog
      summary: Create catalog metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPublicInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /management/v1/catalogs/{catalogType}/{catalogId}:
    get:
      tags:
        - Catalogs
      operationId: getCatalog
      summary: Get catalog metadata
      parameters:
        - $ref: "#/components/parameters/CatalogTypePath"
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPublicInfo"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags:
        - Catalogs
      operationId: updateCatalog
      summary: Update catalog metadata
      parameters:
        - $ref: "#/components/parameters/CatalogTypePath"
        - $ref: "#/components/parameters/CatalogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatalogRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPublicInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Catalogs
      operationId: deleteCatalog
      summary: Delete catalog metadata
      parameters:
        - $ref: "#/components/parameters/CatalogTypePath"
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "204":
          description: Deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /management/v1/security/roles:
    get:
      tags:
        - Security
      operationId: getRoles
      summary: Get role bindings
      parameters:
        - in: query
          name: subject
          required: false
          schema:
            type: string
        - in: query
          name: catalogType
          required: false
          schema:
            $ref: "#/components/schemas/CatalogType"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRolesResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Security
      operationId: updateRoles
      summary: Upsert role bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRolesRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetRolesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Security
      operationId: deleteRoles
      summary: Delete role bindings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRolesRequest"
      responses:
        "204":
          description: Deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CatalogTypePath:
      in: path
      name: catalogType
      required: true
      schema:
        $ref: "#/components/schemas/CatalogType"
    CatalogId:
      in: path
      name: catalogId
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CatalogType:
      type: string
      enum:
        - ICEBERG
        - PAIMON
        - LANCE
    CatalogMode:
      type: string
      enum:
        - INTERNAL
        - PROXY
    CreateCatalogRequest:
      type: object
      required:
        - catalogId
        - catalogType
        - mode
        - spec
      properties:
        catalogId:
          type: string
        catalogType:
          $ref: "#/components/schemas/CatalogType"
        mode:
          $ref: "#/components/schemas/CatalogMode"
        spec:
          $ref: "#/components/schemas/CatalogSpec"
    UpdateCatalogRequest:
      type: object
      required:
        - spec
      properties:
        spec:
          $ref: "#/components/schemas/CatalogSpec"
        expectedVersion:
          type: integer
          format: int64
          nullable: true
    CatalogPublicInfo:
      type: object
      required:
        - catalogId
        - catalogType
        - mode
        - spec
      properties:
        catalogId:
          type: string
        catalogType:
          $ref: "#/components/schemas/CatalogType"
        mode:
          $ref: "#/components/schemas/CatalogMode"
        spec:
          $ref: "#/components/schemas/CatalogSpec"
        version:
          type: integer
          format: int64
          nullable: true
    CatalogSpec:
      type: object
      description: >-
        Flat catalog connector configuration (file IO props, catalog props).
      properties:
        fileIoProperties:
          type: object
          additionalProperties:
            type: string
        catalogProperties:
          type: object
          additionalProperties:
            type: string
    RoleBinding:
      type: object
      required:
        - subject
        - catalogType
        - role
      properties:
        subject:
          type: string
        catalogType:
          $ref: "#/components/schemas/CatalogType"
        role:
          type: string
          description: >-
            Role name assigned to the subject for the catalog type. Valid values depend on
            the active authorization provider (Casbin defaults include IcebergCatalogAdmin,
            IcebergCatalogEditor, IcebergCatalogViewer, and analogous Paimon/Lance roles).
    GetRolesResponse:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
    UpdateRolesRequest:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
    DeleteRolesRequest:
      type: object
      required:
        - bindings
      properties:
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
