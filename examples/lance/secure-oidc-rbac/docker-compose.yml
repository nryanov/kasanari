services:
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: [ "server", "/data", "--console-address", ":9001" ]

  mc:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing minio/warehouse;
      /usr/bin/mc policy set public minio/warehouse;
      tail -f /dev/null
      "

  catalog-storage:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"

  keycloak:
    image: keycloak/keycloak:26.6
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak-realm-kasanari.json:/opt/keycloak/data/import/kasanari-realm.json

  kasanari:
    image: ${KASANARI_IMAGE:-local/kasanari:0.1.0}
    depends_on:
      - catalog-storage
      - mc
      - keycloak
    ports:
      - "9090:9090"
    environment:
      JVM_OPTS: >-
        -Dkasanari.management.metadata.jdbc-properties."kasanari.jdbc.user"=postgres
        -Dkasanari.management.metadata.jdbc-properties."kasanari.jdbc.password"=postgres
        -Dkasanari.management.metadata.jdbc-properties."uri"=jdbc:postgresql://catalog-storage:5432/postgres
        -Dkasanari.authentication.type=oidc
        -Dkasanari.authentication.oidc.issuer-url=http://keycloak:8080/realms/kasanari
        -Dkasanari.authentication.oidc.client-id=kasanari-api
        -Dkasanari.authentication.oidc.client-secret=kasanari-api-secret
        -Dkasanari.authorization.type=casbin
        -Dkasanari.authorization.casbin.superuser-subjects=demo
        -Dkasanari.authorization.casbin.jdbc.user=postgres
        -Dkasanari.authorization.casbin.jdbc.password=postgres
        -Dkasanari.authorization.casbin.jdbc.uri=jdbc:postgresql://catalog-storage:5432/postgres

  client:
    image: postgres:17
    command: [ "sh", "-c", "sleep infinity" ]
    depends_on:
      - kasanari
    working_dir: /work
    volumes:
      - ./:/work
